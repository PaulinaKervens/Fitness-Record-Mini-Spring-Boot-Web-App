<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fitness Tracker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: 0;
            position: absolute;
            right: 0;
        }
    </style>
</head>



<body>

<div class="container">

    <!-- include the header -->
    <header th:include="header.html"> </header>


    <!-- Alert Bar Success -->
    <div th:if="${success}" class="alert alert-success" role="alert">
        <i class="me-2 bi bi-info-circle"></i>
        <span th:text="${message}"/></span>
    </div>

    <!-- Alert Bar Danger -->
    <div th:if="${danger}" class="alert alert-danger" role="alert">
        <i class="me-2 bi bi-info-circle"></i>
        <span th:text="${message}"/></span>
    </div>

    <!-- Form section -->
    <div class="border p-3 rounded">
        <h6 class="mb-3">
            <i class="bi bi-clipboard-data me-2 text-success"></i>
            Add New Record
        </h6>

        <!-- Add Record Form -->
        <form action="/add_activity_record" method="POST" class="mb-2">
            <div class="row g-2">
                <div class="col-md-3">
                    <input type="text"
                           name="route"
                           class="form-control"
                           placeholder="Route"
                           required>
                </div>
                <div class="col-md-3">
                    <input type="number"
                           name="miles"
                           class="form-control"
                           step="0.1"
                           placeholder="Miles"
                           required>
                </div>
                <div class="col-md-3">
                    <input type="date"
                           name="date"
                           class="form-control"
                           required>
                </div>
                <div class="col-md-3 d-grid">
                    <button type="submit"
                            class="btn btn-primary"
                            value="Add Record">
                        Add
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!--  -->
    <div class="mt-3 p-3 bg-light">
        <p class="bold">You currently have <span class="badge bg-primary text-wrap" th:text="${recordCount}"></span> running record.</p>
        <p>Total mileage : <span class="badge bg-primary text-wrap" th:text="${milesRan}"></span> ran.</p>
    </div>


    <!-- include the header -->
    <header th:include="tableview.html"> </header>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
